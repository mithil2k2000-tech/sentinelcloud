# Deliberately excessive: a wildcard ClusterRole bound to payment-service's
# ServiceAccount. In a real incident this is exactly "compromised payment
# container could access unnecessary customer records" (the project's own
# worked example, see docs/phase3-threat-agent.md) but at the Kubernetes
# API layer instead of the cloud IAM layer — a compromised payment-service
# pod could read/write/delete any resource of any kind, cluster-wide, not
# just call the cloud APIs its cloud-side role permits.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: payment-service-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: payment-service-binding
subjects:
  - kind: ServiceAccount
    name: payment-service
    namespace: app
roleRef:
  kind: ClusterRole
  name: payment-service-role
  apiGroup: rbac.authorization.k8s.io

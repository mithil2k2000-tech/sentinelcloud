# One ServiceAccount per workload — matches the per-workload identity
# pattern already used in Terraform (IRSA/Workload Identity/Entra ID
# workload identity, modules/iam). Not the vulnerability here; the RBAC
# bound to these accounts (rbac.yaml) is.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-service
  namespace: app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: app
